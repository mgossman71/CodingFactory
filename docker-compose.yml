name: codingfactory

services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: codingfactory:latest
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # SQLite lives on a NAMED volume, not a bind mount: WAL mode needs real
      # mmap/flock semantics that Docker Desktop bind mounts (virtiofs) do not
      # provide, causing 'disk I/O error' crashes.
      - cf-data:/app/data # SQLite DB (durable; see README for host access)
    extra_hosts:
      # If lxc-strata2 lives on your LAN rather than this host, set
      # STRATA2_IP=<its address> in the shell or a compose override.
      - "lxc-strata2:${STRATA2_IP:-host-gateway}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  # External so compose never owns (or `down -v` deletes) the DB: existing
  # projects are the user's work product (D-019). Create it once with
  # `docker volume create codingfactory_cf-data` (a no-op if it exists).
  cf-data:
    name: codingfactory_cf-data
    external: true
